name: Prepare private release

on:
  workflow_dispatch:
    inputs:
      linux_run:
        description: Successful Linux packages workflow run ID for this tag
        required: true
        type: string
      windows_run:
        description: Successful Windows packages workflow run ID for this tag
        required: true
        type: string
      macos_run:
        description: Successful macOS packages workflow run ID for this tag
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify source runs and tag
        id: source
        env:
          LINUX_RUN: ${{ inputs.linux_run }}
          WINDOWS_RUN: ${{ inputs.windows_run }}
          MACOS_RUN: ${{ inputs.macos_run }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          git rev-parse --verify "$tag^{commit}" >/dev/null
          expected_sha=$(git rev-parse "$tag^{commit}")
          for item in "linux:$LINUX_RUN:Build Linux packages" "windows:$WINDOWS_RUN:Build Windows packages" "macos:$MACOS_RUN:Build macOS packages"; do
            IFS=: read -r platform run_id workflow <<< "$item"
            if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then echo "Invalid $platform run ID" >&2; exit 1; fi
            details=$(gh run view "$run_id" --json headSha,conclusion,workflowName)
            [[ $(jq -r '.headSha' <<< "$details") == "$expected_sha" ]] || { echo "$platform run does not match $tag" >&2; exit 1; }
            [[ $(jq -r '.conclusion' <<< "$details") == success ]] || { echo "$platform run is not successful" >&2; exit 1; }
            [[ $(jq -r '.workflowName' <<< "$details") == "$workflow" ]] || { echo "$platform run has the wrong workflow" >&2; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download verified packages
        env:
          LINUX_RUN: ${{ inputs.linux_run }}
          WINDOWS_RUN: ${{ inputs.windows_run }}
          MACOS_RUN: ${{ inputs.macos_run }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          gh run download "$LINUX_RUN" -n "linux-packages-v$VERSION" -D incoming/linux
          gh run download "$WINDOWS_RUN" -n "windows-x64-v$VERSION" -D incoming/windows-x64
          gh run download "$WINDOWS_RUN" -n "windows-arm64-v$VERSION" -D incoming/windows-arm64
          gh run download "$MACOS_RUN" -n "macos-apple-silicon-v$VERSION" -D incoming/macos-apple-silicon
          gh run download "$MACOS_RUN" -n "macos-intel-v$VERSION" -D incoming/macos-intel

      - name: Verify and assemble release
        run: node scripts/prepare_private_release.mjs "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/incoming"

      - name: Push versioned packages to a review branch
        id: branch
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION-packages-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "releases/v$VERSION"
          git commit -m "Add v$VERSION candidate release packages"
          git push origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open review pull request
        continue-on-error: true
        env:
          VERSION: ${{ steps.source.outputs.version }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" --title "Add v$VERSION release packages" --body "Packages built from the v$VERSION tag. Review and install on every target platform before merging. macOS packages still require Developer ID signing and notarization before public distribution."

      - name: Create draft GitHub Release
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; refusing to replace its assets" >&2
            exit 1
          fi
          gh release create "v$VERSION" release-assets/"v$VERSION"/* --verify-tag --draft --title "MagicRenamer v$VERSION" --notes "Private preview builds. Install and test each platform package before publication. macOS DMGs are unsigned and unnotarized."

      - name: Show review links
        if: always() && steps.branch.outputs.branch != ''
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          echo "Package branch: https://github.com/$GITHUB_REPOSITORY/tree/$BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "Open a pull request: https://github.com/$GITHUB_REPOSITORY/compare/${{ github.event.repository.default_branch }}...$BRANCH?expand=1" >> "$GITHUB_STEP_SUMMARY"
          echo "Draft release: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"

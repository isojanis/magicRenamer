name: Build Linux packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential file libayatana-appindicator3-dev libssl-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf \
            pkg-config rpm xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:all

      - name: Build DEB and RPM
        run: npm run tauri -- build --bundles deb,rpm --ci

      - name: Verify and stage packages
        id: stage
        run: node scripts/stage_linux_release.mjs "$RUNNER_TEMP"

      - name: Upload packages for review
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages-v${{ steps.stage.outputs.version }}
          path: ${{ runner.temp }}/releases/v${{ steps.stage.outputs.version }}/
          if-no-files-found: error
          retention-days: 30
